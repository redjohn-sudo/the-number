<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Numéro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="scene" class="scene">
  <div id="scene-image" class="scene-image">
    <img src="img/bureau.jpg" alt="Un bureau plongé dans la nuit, un seul écran allumé.">
    <button id="ecran-bureau" class="ecran-bureau" aria-label="S'asseoir devant l'ordinateur">
      <span class="ecran-contenu">
        <span class="ecran-heure" id="ecran-heure">23:04</span>
        <span class="ecran-invite">Cliquer pour se connecter</span>
      </span>
    </button>
  </div>
  <p class="scene-aide">Clique sur l'écran</p>
</div>

<div id="os" class="os" hidden>
  <svg id="carte" class="carte" aria-hidden="true"></svg>

  <div class="barre-menu">
    <span class="logo">Veille</span>
    <span id="app-active" class="app-active">Bureau</span>
    <span class="menu-droite">
      <span id="m-vie" class="m-vie" hidden><span class="m-vie-piste"><span id="m-vie-jauge"></span></span><span id="m-vie-texte">100 %</span></span>
      <span id="m-chrono" class="m-chrono" hidden>03:00</span>
      <span id="m-operateur" class="m-operateur"></span>
    </span>
  </div>

  <div id="bureau" class="bureau"></div>

  <nav id="dock" class="dock" hidden>
    <button data-app="dossier"><span class="icone" data-icone="dossier"></span><span>Dossier</span></button>
    <button data-app="fichiers"><span class="icone" data-icone="fichiers"></span><span>Fichiers</span></button>
    <button data-app="ecoute"><span class="icone" data-icone="ecoute"></span><span>Écoute</span></button>
    <button data-app="verdict" class="dock-verdict"><span class="icone" data-icone="verdict"></span><span>Trancher</span></button>
  </nav>

  <div id="verrou" class="verrou" hidden>
    <div class="verrou-carte">
      <p id="verrou-heure" class="verrou-heure"></p>
      <div id="avatar" class="avatar">?</div>
      <form id="form-profil" class="form-profil">
        <h1 id="verrou-titre">Qui veille cette nuit&nbsp;?</h1>
        <div id="champs-profil">
          <label for="nom-code">Nom de code</label>
          <input id="nom-code" maxlength="24" autocomplete="off" placeholder="Ex. Corbeau">
          <div class="puces" role="radiogroup" aria-label="Tu es">
            <label><input type="radio" name="genre" value="m"> Opérateur</label>
            <label><input type="radio" name="genre" value="f"> Opératrice</label>
            <label><input type="radio" name="genre" value="n"> Analyste</label>
          </div>
        </div>
        <button class="bouton principal">Se connecter</button>
        <button type="button" id="changer" class="lien" hidden>Changer d'identité</button>
        <p id="erreur-profil" class="erreur" hidden></p>
      </form>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
